name: TidaLine CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest chispa pyspark==3.5.1
        
    - name: Run PySpark Tests
      run: |
        pytest tests/test_transformations.py -v

  dbt-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dbt
      run: |
        python -m pip install --upgrade pip
        pip install dbt-core dbt-trino

    - name: Run dbt Tests (Dry Run)
      run: |
        cd transform
        # We run dbt compile in CI just to ensure the SQL syntax and Jinja compile correctly
        dbt compile --profiles-dir .
