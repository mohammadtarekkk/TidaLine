groups:
  - name: tidaline_alerts
    rules:
      # --- Container Health ---
      - alert: ContainerDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Target {{ $labels.instance }} has been unreachable for over 1 minute."

      # --- Postgres ---
      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection count is high ({{ $value }})"

      - alert: PostgresReplicationSlotInactive
        expr: pg_replication_slots_active == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres replication slot is inactive — Debezium CDC may be broken"

      # --- Redpanda / Kafka ---
      - alert: RedpandaConsumerLagHigh
        expr: redpanda_kafka_consumer_group_committed_offset - redpanda_kafka_consumer_group_log_end_offset > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redpanda consumer lag is high ({{ $value }} messages behind)"
